<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unicorn Drifter — Terrain Editor</title>
<link rel="stylesheet" href="/src/editor.css">
</head>
<body class="editor">
<main class="editor__workspace">
  <canvas id="editor-canvas" class="editor__canvas"></canvas>
  <aside class="editor__panel" aria-label="Terrain tools">
    <h1 class="editor__title">TERRAIN</h1>
    <h2 class="editor__heading">LAYER</h2>
    <div class="editor__tools" role="group" aria-label="Terrain layer">
      <button class="editor__tool is-active" data-kind="grass">Grass <kbd>1</kbd></button>
      <button class="editor__tool" data-kind="dirt">Dirt <kbd>2</kbd></button>
      <button class="editor__tool" data-kind="water">Water <kbd>3</kbd></button>
      <button class="editor__tool" data-kind="stones">Stones <kbd>4</kbd></button>
      <button class="editor__tool" data-kind="ruins">Floor <kbd>5</kbd></button>
      <button class="editor__tool" data-kind="bushes">Bushes <kbd>6</kbd></button>
      <button class="editor__tool editor__tool--collision" data-kind="collision">Collision <kbd>7</kbd></button>
    </div>
    <h2 class="editor__heading">TOOL</h2>
    <div class="editor__tools" role="group" aria-label="Drawing tool">
      <button class="editor__tool is-active" data-mode="pencil">Pencil <kbd>P</kbd></button>
      <button class="editor__tool" data-mode="rectangle">Rectangle <kbd>R</kbd></button>
      <button class="editor__tool" data-mode="fill">Fill <kbd>F</kbd></button>
      <button class="editor__tool editor__tool--erase" data-mode="erase">Erase <kbd>E</kbd></button>
      <button class="editor__tool" data-mode="inspect">Inspect <kbd>I</kbd></button>
    </div>
    <label class="editor__field">Brush size
      <input id="editor-size" type="range" min="1" max="5" step="1" value="1">
      <output id="editor-size-value">1</output>
    </label>
    <label class="editor__check"><input id="editor-grid" type="checkbox" checked> Show grid</label>
    <label class="editor__check"><input id="editor-collision" type="checkbox" checked> Show collision</label>
    <section class="editor__inspector" aria-label="Inspected tile layers">
      <h2 class="editor__heading">TILE <span id="editor-inspector-coordinates">—</span></h2>
      <p id="editor-inspector-empty" class="editor__inspector-empty">Choose Inspect, then click a tile.</p>
      <div id="editor-inspector-layers" class="editor__inspector-layers"></div>
    </section>
    <div class="editor__row">
      <button class="editor__button" data-action="regen">Regen seed</button>
      <span id="editor-seed" class="editor__seed"></span>
    </div>
    <div class="editor__row">
      <button class="editor__button" data-action="undo">Undo</button>
      <button class="editor__button" data-action="redo">Redo</button>
    </div>
    <div class="editor__row">
      <button class="editor__button" data-action="load">Reload</button>
      <button class="editor__button" data-action="save">Save</button>
      <button class="editor__button" data-action="download">Download</button>
    </div>
    <p class="editor__help">Drag to draw · I inspect · RMB erase · WASD/arrows or middle/Space drag pan · wheel zoom · [ ] brush size</p>
    <p id="editor-status" class="editor__status" role="status">Ready</p>
  </aside>
</main>
<script type="module" src="/src/editor.js"></script>
</body>
</html>
