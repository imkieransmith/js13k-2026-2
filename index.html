<!doctype html>
<html lang="en" class="page size-full bg-sky-300 overflow-hidden">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JS13k 2026</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body class="page__body size-full bg-sky-300 overflow-hidden">
<div id="game" class="game h-dvh"><main id="scene" class="scene relative size-full overflow-hidden">
<canvas id="c" class="scene__canvas block size-full touch-none"></canvas>
<div id="hud" class="hud portrait:flex portrait:flex-col portrait:items-center portrait:gap-4 absolute size-0 portrait:w-max portrait:h-auto portrait:-mt-8 pointer-events-none portrait:-translate-x-1/2 portrait:-translate-y-full" role="status">
  <span class="hud__item hud__item--coins flex items-center gap-1 absolute portrait:static right-9 -top-6 h-7 bg-violet-700 text-xs text-amber-300 font-extrabold leading-none px-2 shadow-md pointer-events-none">
    <svg id="hud-coin" class="hud__icon block shrink-0 w-2.5 h-3 overflow-hidden" viewBox="0 0 5 6" aria-hidden="true">
      <rect id="coin-edge" y="0" height="6" fill="#e6a817"/>
      <rect id="coin-face" y="1" height="4" fill="#ffd54a"/>
      <rect id="coin-glint" x="1.5" y="1" width="1" height="1" fill="#ffec8a"/>
    </svg>
    <span id="hud-money" class="hud__value tabular-nums whitespace-nowrap"></span>
  </span>
  <span class="hud__item hud__item--chase flex portrait:-order-1 items-center gap-1 absolute portrait:static right-1 -top-20 h-7 bg-violet-700 text-xs text-amber-300 font-extrabold leading-none px-2 shadow-md pointer-events-none">
    <svg id="hud-rainbow" class="hud__icon block shrink-0 w-2.5 h-3 overflow-hidden" viewBox="0 0 5 6" aria-hidden="true">
      <path fill="#f66f93" d="M0 0h5v1H1v5H0z"/>
      <path fill="#ffe477" d="M1 1h4v1H2v4H1z"/>
      <path fill="#73d584" d="M2 2h3v1H3v3H2z"/>
      <path fill="#59abea" d="M3 3h2v1H4v2H3z"/>
      <path fill="#bd72d9" d="M4 4h1v2H4z"/>
    </svg>
    <span id="hud-distance" class="hud__value tabular-nums whitespace-nowrap"></span>
  </span>
</div>
<button id="hud-upgrade" class="hud__upgrade flex items-center justify-center absolute min-w-20 h-7 bg-rose-500 text-xs text-white font-extrabold leading-none pl-2.5 pr-4 border-0 portrait:mt-0 appearance-none cursor-pointer touch-manipulation hover:brightness-110 active:brightness-90 focus-visible:outline-2 focus-visible:outline-amber-300 focus-visible:outline-offset-2 -translate-x-1/2 translate-y-14 portrait:translate-y-10" type="button" aria-label="Open upgrades" aria-expanded="false" aria-controls="upgrade-menu">
  <span id="hud-upgrade-text">Upgrade</span>
</button>
<dialog id="upgrade-menu" class="upgrade hidden open:flex flex-col fixed inset-0 z-50 w-11/12 max-w-4xl h-11/12 max-h-160 bg-amber-50 backdrop:bg-slate-800/60 text-stone-800 font-sans p-0 border-0 m-auto overflow-visible shadow-2xl" aria-labelledby="upgrade-title">
  <header class="upgrade__head flex flex-wrap sm:flex-nowrap items-center gap-2 sm:gap-6 shrink-0 min-h-28 sm:min-h-24 bg-violet-700 text-white p-2 sm:px-7 sm:py-5">
    <div class="profile flex flex-1 items-center gap-2 sm:gap-4 min-w-0">
      <span class="profile__avatar block shrink-0 relative size-10 sm:size-12 bg-violet-300 border-2 border-amber-50 rounded-full overflow-hidden" aria-hidden="true"><img class="profile__image block absolute top-0 left-0 w-112 max-w-none -translate-x-6.5 -translate-y-1.5" src="/src/assets/unicorn.png" alt=""></span>
      <div class="profile__copy min-w-0"><h2 id="upgrade-title" class="profile__name min-w-0 text-lg sm:text-2xl font-bold leading-none overflow-hidden text-ellipsis whitespace-nowrap">Starlight</h2><span id="upgrade-bio" class="profile__bio block text-xs text-violet-200 leading-tight mt-1 overflow-hidden"></span></div>
    </div>
    <div class="upgrade__stats flex order-3 sm:order-none gap-4 sm:gap-6 w-full sm:w-auto">
      <span class="upgrade__stat flex flex-col min-w-12 sm:min-w-16"><b id="upgrade-money" class="upgrade__stat-value text-base sm:text-xl text-amber-300 font-bold leading-none tabular-nums">0</b><small class="upgrade__stat-label text-xs text-violet-200 font-extrabold tracking-widest mt-1">COINS</small></span>
      <span class="upgrade__stat flex flex-col min-w-12 sm:min-w-16"><b id="upgrade-chase" class="upgrade__stat-value text-base sm:text-xl text-amber-300 font-bold leading-none tabular-nums">204</b><small class="upgrade__stat-label text-xs text-violet-200 font-extrabold tracking-widest mt-1">CHASE</small></span>
    </div>
    <button id="upgrade-close" class="upgrade__close flex items-center justify-center shrink-0 size-10 sm:size-11 bg-amber-50 text-2xl text-violet-700 font-extrabold leading-none pb-1 border-0 appearance-none cursor-pointer touch-manipulation hover:brightness-110 active:brightness-90 focus-visible:outline-2 focus-visible:outline-amber-300 focus-visible:outline-offset-2" type="button" aria-label="Close upgrades">×</button>
  </header>
  <div id="upgrade-list" class="upgrade__list flex-1 min-h-0 px-2 sm:px-7 overflow-auto overscroll-contain">
    <div class="upgrade__row upgrade__row--speed flex flex-wrap sm:flex-nowrap items-start sm:items-center gap-2 sm:gap-4 min-h-24 py-3 sm:py-4 border-b border-amber-200 last:border-b-0">
      <span class="upgrade__pennant grid place-items-center self-start shrink-0 w-8 sm:w-13 h-10 sm:h-14 bg-rose-500" aria-hidden="true"><svg class="upgrade__pennant-icon size-4 sm:size-6 fill-none stroke-2 stroke-white" viewBox="0 0 20 20"><path d="M2 13h5l3-7 3 8 2-5 3 4"/></svg></span>
      <div class="upgrade__copy flex-1 min-w-0"><div class="upgrade__name-line flex items-baseline gap-2 sm:gap-3"><strong class="upgrade__name text-sm sm:text-lg font-bold">Gallop</strong><span class="upgrade__level text-xs text-stone-500 font-medium tracking-widest">LV <b class="font-medium"></b></span></div><small class="upgrade__description block text-xs text-stone-500 leading-tight mt-1">Turn every stride into a dash</small><span class="upgrade__promise block text-xs text-rose-700 font-extrabold leading-tight mt-1">Next: even more zoom</span></div>
      <div class="upgrade__buy flex sm:flex-col items-center sm:items-end justify-between gap-2 w-full sm:w-auto sm:min-w-28"><span class="upgrade__cost text-xs text-stone-500 whitespace-nowrap"></span><button class="upgrade__button flex items-center justify-center shrink-0 w-22 sm:w-30 h-8 sm:h-10 bg-rose-500 aria-disabled:bg-stone-300 text-xs sm:text-sm text-white aria-disabled:text-amber-50 font-extrabold leading-none pl-2 pr-4 border-0 appearance-none cursor-pointer aria-disabled:cursor-not-allowed touch-manipulation hover:brightness-110 active:brightness-90 focus-visible:outline-2 focus-visible:outline-violet-700 focus-visible:outline-offset-2" type="button" data-up="speed">Upgrade</button></div>
    </div>
    <div class="upgrade__row upgrade__row--magnet flex flex-wrap sm:flex-nowrap items-start sm:items-center gap-2 sm:gap-4 min-h-24 py-3 sm:py-4 border-b border-amber-200 last:border-b-0">
      <span class="upgrade__pennant grid place-items-center self-start shrink-0 w-8 sm:w-13 h-10 sm:h-14 bg-amber-500" aria-hidden="true"><svg class="upgrade__pennant-icon size-4 sm:size-6 fill-none stroke-2 stroke-white" viewBox="0 0 20 20"><path d="M4 4v8a6 6 0 0012 0V4m-4 0v8a2 2 0 01-4 0V4"/></svg></span>
      <div class="upgrade__copy flex-1 min-w-0"><div class="upgrade__name-line flex items-baseline gap-2 sm:gap-3"><strong class="upgrade__name text-sm sm:text-lg font-bold">Magnet</strong><span class="upgrade__level text-xs text-stone-500 font-medium tracking-widest">LV <b class="font-medium"></b></span></div><small class="upgrade__description block text-xs text-stone-500 leading-tight mt-1">Call distant coins your way</small><span class="upgrade__promise block text-xs text-rose-700 font-extrabold leading-tight mt-1">Next: a wider sparkle pull</span></div>
      <div class="upgrade__buy flex sm:flex-col items-center sm:items-end justify-between gap-2 w-full sm:w-auto sm:min-w-28"><span class="upgrade__cost text-xs text-stone-500 whitespace-nowrap"></span><button class="upgrade__button flex items-center justify-center shrink-0 w-22 sm:w-30 h-8 sm:h-10 bg-rose-500 aria-disabled:bg-stone-300 text-xs sm:text-sm text-white aria-disabled:text-amber-50 font-extrabold leading-none pl-2 pr-4 border-0 appearance-none cursor-pointer aria-disabled:cursor-not-allowed touch-manipulation hover:brightness-110 active:brightness-90 focus-visible:outline-2 focus-visible:outline-violet-700 focus-visible:outline-offset-2" type="button" data-up="magnet">Upgrade</button></div>
    </div>
    <div class="upgrade__row upgrade__row--luck flex flex-wrap sm:flex-nowrap items-start sm:items-center gap-2 sm:gap-4 min-h-24 py-3 sm:py-4 border-b border-amber-200 last:border-b-0">
      <span class="upgrade__pennant grid place-items-center self-start shrink-0 w-8 sm:w-13 h-10 sm:h-14 bg-emerald-400" aria-hidden="true"><svg class="upgrade__pennant-icon size-4 sm:size-6 fill-none stroke-2 stroke-white" viewBox="0 0 20 20"><path d="M10 1l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/></svg></span>
      <div class="upgrade__copy flex-1 min-w-0"><div class="upgrade__name-line flex items-baseline gap-2 sm:gap-3"><strong class="upgrade__name text-sm sm:text-lg font-bold">Optimism</strong><span class="upgrade__level text-xs text-stone-500 font-medium tracking-widest">LV <b class="font-medium"></b></span></div><small class="upgrade__description block text-xs text-stone-500 leading-tight mt-1">Invite luck onto the trail</small><span class="upgrade__promise block text-xs text-rose-700 font-extrabold leading-tight mt-1">Next: good things happen sooner</span></div>
      <div class="upgrade__buy flex sm:flex-col items-center sm:items-end justify-between gap-2 w-full sm:w-auto sm:min-w-28"><span class="upgrade__cost text-xs text-stone-500 whitespace-nowrap"></span><button class="upgrade__button flex items-center justify-center shrink-0 w-22 sm:w-30 h-8 sm:h-10 bg-rose-500 aria-disabled:bg-stone-300 text-xs sm:text-sm text-white aria-disabled:text-amber-50 font-extrabold leading-none pl-2 pr-4 border-0 appearance-none cursor-pointer aria-disabled:cursor-not-allowed touch-manipulation hover:brightness-110 active:brightness-90 focus-visible:outline-2 focus-visible:outline-violet-700 focus-visible:outline-offset-2" type="button" data-up="luck">Upgrade</button></div>
    </div>
    <div class="upgrade__row upgrade__row--stubborn flex flex-wrap sm:flex-nowrap items-start sm:items-center gap-2 sm:gap-4 min-h-24 py-3 sm:py-4 border-b border-amber-200 last:border-b-0">
      <span class="upgrade__pennant grid place-items-center self-start shrink-0 w-8 sm:w-13 h-10 sm:h-14 bg-blue-500" aria-hidden="true"><svg class="upgrade__pennant-icon size-4 sm:size-6 fill-none stroke-2 stroke-white" viewBox="0 0 20 20"><path d="M10 2l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V5z"/></svg></span>
      <div class="upgrade__copy flex-1 min-w-0"><div class="upgrade__name-line flex items-baseline gap-2 sm:gap-3"><strong class="upgrade__name text-sm sm:text-lg font-bold">Grit</strong><span class="upgrade__level text-xs text-stone-500 font-medium tracking-widest">LV <b class="font-medium"></b></span></div><small class="upgrade__description block text-xs text-stone-500 leading-tight mt-1">Never lose sight of the rainbow</small><span class="upgrade__promise block text-xs text-rose-700 font-extrabold leading-tight mt-1">Next: destiny draws closer</span></div>
      <div class="upgrade__buy flex sm:flex-col items-center sm:items-end justify-between gap-2 w-full sm:w-auto sm:min-w-28"><span class="upgrade__cost text-xs text-stone-500 whitespace-nowrap"></span><button class="upgrade__button flex items-center justify-center shrink-0 w-22 sm:w-30 h-8 sm:h-10 bg-rose-500 aria-disabled:bg-stone-300 text-xs sm:text-sm text-white aria-disabled:text-amber-50 font-extrabold leading-none pl-2 pr-4 border-0 appearance-none cursor-pointer aria-disabled:cursor-not-allowed touch-manipulation hover:brightness-110 active:brightness-90 focus-visible:outline-2 focus-visible:outline-violet-700 focus-visible:outline-offset-2" type="button" data-up="stubborn">Upgrade</button></div>
    </div>
  </div>
  <div class="upgrade__paper-edge absolute right-0 -bottom-3 left-0 h-3 pointer-events-none" aria-hidden="true"></div>
</dialog>
</main></div>
<script type="module" src="/src/game.js"></script>
</body>
</html>
