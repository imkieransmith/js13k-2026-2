<!doctype html>
<html lang="en">
<head>

<title>Unicorn Drifter</title>

</head>
<body>
<main id="game">
  <canvas id="c" tabindex="0" aria-label="Game field. Move with W A S D, aim with the mouse, attack with left click, and dash with Space."></canvas>
